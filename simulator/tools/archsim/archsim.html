<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archsim</title>
<style>
/* archsim tokens (PLAN Part 5). Light default, dark by OS preference unless data-theme="light", or forced dark. */
:root {
  --surface: #fcfcfb; --page: #f9f9f7;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --accent: #2a78d6;
  --hatch: repeating-linear-gradient(135deg, transparent 0 5px, var(--axis) 5px 7px);
  --topbar-h: 44px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #1a1a19; --page: #0d0d0d;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --accent: #3987e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #1a1a19; --page: #0d0d0d;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --accent: #3987e5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.muted { color: var(--muted); }
.num, code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
h1 { font-size: 16px; margin: 0; }
h2 { font-size: 15px; margin: 12px 0 6px; }
h3 { font-size: 13px; margin: 10px 0 4px; color: var(--ink-2); }
button, select, input {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 4px; padding: 3px 8px; min-height: 28px;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
table { border-collapse: collapse; }
th, td { border-bottom: 1px solid var(--grid); padding: 3px 8px; text-align: left; vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.r, th.r { text-align: right; }

/* ---------------------------------------------------------------- layout (PLAN-v2 1.1, 1.5) */
#topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--grid); }
#topbar h1 { flex: none; }
#stamp { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#knobs-toggle { display: none; }

#layout { display: grid; grid-template-columns: 340px minmax(0, 1fr) 400px; grid-template-areas: "left main side"; align-items: start; }
#left { grid-area: left; position: sticky; top: var(--topbar-h); max-height: calc(100vh - var(--topbar-h)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--grid); }
#chip { padding: 8px 16px 0; }
#rail { padding: 8px 16px 16px; }
#main { grid-area: main; padding: 12px 16px; min-width: 0; }
#side { grid-area: side; position: sticky; top: var(--topbar-h); max-height: calc(100vh - var(--topbar-h)); overflow-y: auto; padding: 8px 16px 16px; background: var(--surface); border-left: 1px solid var(--grid); min-width: 0; }
#side:empty::before { content: "Click a value, a cell or a chip-check row to see its derivation here."; color: var(--muted); font-size: 12px; }
.side-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--grid); }
.side-body { overflow-wrap: anywhere; font-size: 13px; }
.side-body table { max-width: 100%; }

#rail .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; align-items: center; }
#rail details { border-top: 1px solid var(--grid); padding: 4px 0; }
#rail summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.knob { margin: 6px 0; }
.knob label { display: block; font-size: 12px; color: var(--ink-2); }
.knob .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.knob input[type=number] { width: 80px; }
.knob input[type=range] { flex: 1; min-width: 80px; padding: 0; }
.knob select { max-width: 100%; }
.knob .help { font-size: 11px; color: var(--muted); }
.knob .u { font-size: 11px; color: var(--muted); }
.knob fieldset { border: 1px solid var(--grid); border-radius: 4px; margin: 0; padding: 4px 8px; }
.knob fieldset label { display: block; color: var(--ink); }

#focus { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }
#focus .focus-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
#focus label { font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
#focus select { max-width: 100%; }
#focus .focus-note { font-size: 12px; color: var(--ink-2); border-left: 3px solid var(--warn); padding: 2px 8px; }
#tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--grid); margin-bottom: 12px; }
#tabs button { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 6px 12px; }
#tabs button[aria-selected="true"] { border-bottom-color: var(--accent); font-weight: 600; }
#view { min-height: 200px; min-width: 0; }
.stub { color: var(--muted); padding: 24px 0; }
.tbl { overflow-x: auto; max-width: 100%; }
.chip-fail { background-image: var(--hatch); }
button.stat, .stat { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 4px 10px; min-width: 96px; }
.stat .k { font-size: 11px; color: var(--muted); }
.stat .v { font-size: 15px; font-weight: 600; }
.stat .s { font-size: 11px; color: var(--ink-2); }
[data-side], [data-focus-wl], [data-focus-col] { cursor: pointer; }

/* 900-1279 px: rail + main, the derivation panel is a right drawer */
@media (max-width: 1279px) {
  #layout { grid-template-columns: 320px minmax(0, 1fr); grid-template-areas: "left main"; }
  #side { display: none; }
  body.has-side #side { display: block; position: fixed; top: var(--topbar-h); right: 0; bottom: 0; width: 420px; max-width: 100vw; max-height: none; z-index: 20; box-shadow: 0 0 12px var(--axis); }
}
/* < 900 px: one column; the rail is a full-screen sheet, #chip a sticky strip, the side panel a full-screen sheet */
@media (max-width: 899px) {
  #layout { display: block; }
  #left { display: contents; }
  #chip { position: sticky; top: var(--topbar-h); z-index: 10; padding: 4px 16px; background: var(--surface); border-bottom: 1px solid var(--grid); }
  #chip .chip-body { display: none; }
  #chip .chip-head { cursor: pointer; min-height: 32px; display: flex; align-items: center; gap: 8px; }
  #rail { display: none; }
  body.panel-open #rail { display: block; position: fixed; top: var(--topbar-h); left: 0; right: 0; bottom: 0; z-index: 25; overflow-y: auto; background: var(--surface); }
  #knobs-toggle { display: inline-block; }
  body.has-side #side { top: var(--topbar-h); left: 0; width: auto; box-shadow: none; z-index: 28; }
  #tabs { flex-wrap: nowrap; overflow-x: auto; }
  #tabs button { flex: none; min-height: 32px; }
  button, select, input { min-height: 32px; }
}
@media (max-width: 599px) {
  #topbar, #main { padding-left: 16px; padding-right: 16px; }
  .stat { min-width: 80px; }
}

/* ---------------------------------------------------------------- shared components (views build on these) */
.badge { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 6px; border: 1px solid var(--axis); border-radius: 8px; color: var(--ink-2); white-space: nowrap; }
.badge.m-flow, .badge.m-iss, .badge.m-rtl, .badge.m-synth, .badge.m-spice, .badge.m-spec { border-color: var(--s1); }
.badge.st-measured { border-color: var(--good); }
.badge.st-estimate, .badge.st-judgement, .badge.st-unverified, .badge.st-disputed { border-color: var(--warn); }
.verdict { white-space: nowrap; font-weight: 600; }
.verdict.served { color: var(--ink); } .verdict.served .ic { color: var(--good); }
.verdict.marginal .ic { color: var(--warn); }
.verdict.impossible .ic { color: var(--bad); }
.lo, .hi { color: var(--muted); font-size: 12px; }
svg text { fill: var(--ink-2); font: 11px system-ui, sans-serif; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
.mx-bar { display: block; margin: 2px 0; }
.mx-bar .mx-track { stroke: var(--axis); stroke-width: 1; }
.mx-bar .mx-range { fill: var(--s1); opacity: .55; }
.mx-bar .mx-nom { stroke: var(--ink); stroke-width: 2; }
.mx-bar .mx-zero { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 2; }
.mx-tree details { margin: 4px 0; }
.mx-tree summary { cursor: pointer; padding: 2px 0; }
.mx-sub { margin: 2px 0 2px 8px; }
.mx-terms { list-style: none; margin: 4px 0 4px 6px; padding-left: 10px; border-left: 2px solid var(--grid); }
.mx-term { margin: 4px 0; }
.mx-formula { background: var(--page); padding: 2px 6px; border-radius: 3px; overflow-x: auto; }
.mx-src, .mx-assume { margin: 2px 0 2px 0; padding-left: 18px; font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.render-error { border: 2px solid var(--bad); background: var(--surface); padding: 8px 12px; margin: 8px 0; }
.verdict.chip-pass .ic { color: var(--good); } .verdict.chip-marginal .ic { color: var(--warn); } .verdict.chip-fail .ic { color: var(--bad); }
.badge.st-estimate, .badge.st-judgement { border-style: dashed; }

/* Configure styles. Selectors scoped under .chip-card / .v-configure; colours only through tokens. */
.chip-card { border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); margin-bottom: 8px; }
.chip-card .chip-head { padding: 6px 10px; font-weight: 600; }
.chip-card .chip-body { padding: 0 10px 8px; }
.chip-card .chip-sub { font-size: 11px; margin-bottom: 4px; }
.chip-card .chip-row { border-top: 1px solid var(--grid); padding: 3px 0; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.chip-card .chip-row.fail { border-left: 3px solid var(--bad); padding-left: 6px; background-image: var(--hatch); }
.chip-card .chip-row.marginal { border-left: 3px solid var(--warn); padding-left: 6px; }
.chip-card .chip-item { display: inline-flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; text-align: left; border: none; background: none; padding: 2px 4px; min-height: 0; }
.chip-card .chip-item:hover { background: var(--page); }
.chip-card .chip-item .nm { font-weight: 600; }
.chip-card .chip-item .mg { font-size: 12px; }
.chip-card .badge.driver { border-color: var(--accent); color: var(--ink); }
.chip-card .lo { color: var(--muted); font-size: 11px; }
.linklike { border: none; background: none; color: var(--accent); text-decoration: underline; padding: 0 2px; min-height: 0; font-size: 12px; }
.v-configure h2 { margin-top: 10px; }
.v-configure .cfg-note { font-size: 11px; color: var(--muted); margin: 4px 0; }
.v-configure .pts { list-style: none; margin: 0; padding: 0; }
.v-configure .pt { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; padding: 3px 0; border-top: 1px solid var(--grid); }
.v-configure .pt.cur .pt-name { font-weight: 700; border-color: var(--accent); }
.v-configure .pt button { font-size: 12px; min-height: 24px; padding: 1px 6px; }
.v-configure .dgm svg { display: block; max-width: 100%; height: auto; }
.v-configure .dgm text { font-size: 9.5px; fill: var(--ink); }
.v-configure .dgm .tag, .v-configure .dgm .foot { fill: var(--muted); font-size: 8.5px; }
.v-configure .dgm .blk { cursor: pointer; }
.v-configure .dgm .blk rect { fill: var(--surface); stroke: var(--axis); stroke-width: 1; }
.v-configure .dgm .blk.b-engine rect { stroke: var(--s1); }
.v-configure .dgm .blk.off rect { stroke-dasharray: 3 2; }
.v-configure .dgm .blk.off text { fill: var(--muted); }
.v-configure .dgm .blk.binding rect { stroke: var(--accent); stroke-width: 2.5; }
.v-configure .dgm .blk.chip-driver rect { stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: 6 2; }
.v-configure .dgm .blk:hover rect, .v-configure .dgm .blk:focus-visible rect { fill: var(--page); }
.v-configure .dgm .wire { fill: none; stroke: var(--axis); stroke-width: 1; }
.v-configure details .help.cfg-note { margin: 2px 0 6px; }

/* Capability styles. Scope every selector under .v-capability (or .cap-side for the side-panel kind `cell`); colours only through tokens. */
.v-capability .cap-sub { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.v-capability .cap-sub button[aria-selected="true"] { border-color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.v-capability .mx-controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 6px; }
.v-capability .mx-chip[aria-pressed="true"], .v-capability .mx-allpts[aria-pressed="true"] { border-color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.v-capability .mx-search input { width: 140px; }
.v-capability .mx-legend, .v-capability .mx-diffnote { margin: 4px 0; font-size: 12px; }
.v-capability .mx-allpts { display: none; }
.v-capability .mx-table { min-width: 100%; border-collapse: separate; border-spacing: 0; }
.v-capability .mx-table th.mx-wl { font-weight: 500; color: var(--ink); text-align: left; }
.v-capability .mx-wlcol { min-width: 160px; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.v-capability .mx-wlbtn { border: none; background: none; padding: 0; min-height: 0; font-weight: 600; text-align: left; cursor: pointer; color: var(--ink); }
.v-capability .mx-wl .mono { display: block; font-size: 11px; }
.v-capability .mx-scn { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.v-capability .mx-diff { font-size: 11px; border: 1px solid var(--warn); border-radius: 8px; padding: 0 6px; white-space: nowrap; }
.v-capability .mx-diff.soft { border-style: dashed; }
.v-capability .mx-colhead { min-width: 190px; text-align: left; vertical-align: top; }
.v-capability .mx-colhead.mx-focus-col { box-shadow: inset 0 -3px 0 var(--accent); }
.v-capability .mx-colname { display: block; border: none; background: none; padding: 0; min-height: 0; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; }
.v-capability .mx-chipbadge { display: block; border: none; background: none; padding: 2px 0; min-height: 0; font-size: 12px; font-weight: 400; cursor: pointer; text-align: left; color: var(--ink-2); }
.v-capability .mx-colsub { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.v-capability .mx-chipcap td { font-size: 12px; color: var(--ink); vertical-align: top; }
.v-capability .mx-capt { display: block; padding: 2px 4px; background: var(--surface); }
.v-capability .mx-group th { text-align: left; background: var(--page); border-top: 1px solid var(--grid); padding: 6px 8px; }
.v-capability .mx-group.sub th { font-weight: 500; font-size: 12px; color: var(--ink-2); padding-left: 24px; background: var(--surface); }
.v-capability .mx-cell { padding: 0; border-left: 3px solid transparent; vertical-align: top; }
.v-capability .mx-cell.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
.v-capability .mx-cell.v-served { border-left-color: var(--good); }
.v-capability .mx-cell.v-marginal { border-left-color: var(--warn); }
.v-capability .mx-cell.v-impossible { border-left-color: var(--bad); }
.v-capability .mx-cellbtn { display: block; width: 100%; height: 100%; text-align: left; border: none; border-radius: 0; background: none; padding: 4px 8px; font: inherit; color: inherit; cursor: pointer; min-height: 32px; }
.v-capability .mx-cellbtn:hover { background: var(--page); }
.v-capability .mx-cellbtn > * { display: block; }
.v-capability .mx-head { font-size: 12px; }
.v-capability .mx-max { font-size: 11px; color: var(--muted); }
.v-capability .mx-mixv, .cap-side .mx-mixv { font-weight: 600; white-space: nowrap; }
.v-capability .mx-mixv.served .ic { color: var(--good); } .v-capability .mx-mixv.marginal .ic { color: var(--warn); } .v-capability .mx-mixv.impossible .ic { color: var(--bad); }
.v-capability .mx-link, .cap-side .mx-link { border: none; background: none; padding: 0; min-height: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
.v-capability .mx-pick { margin: 8px 0; }
.v-capability .mx-pick summary { cursor: pointer; }
.v-capability .mx-pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 12px; margin: 6px 0; }
.v-capability .mx-how { margin-top: 12px; font-size: 13px; }
.v-capability .mx-how summary { cursor: pointer; }
.cap-side { font-size: 13px; }
.cap-side .mx-blocks { font-size: 11px; border: 1px solid var(--bad); border-radius: 8px; padding: 0 6px; }
.cap-side .mx-tag { font-size: 11px; border: 1px solid var(--axis); border-radius: 8px; padding: 0 6px; color: var(--ink-2); }
.cap-side .mx-lim { border: 1px solid var(--grid); border-radius: 4px; padding: 2px 8px; }
.cap-side .mx-notmodelled { margin-top: 12px; }
.v-capability .mx-mixchips { margin: 6px 0; }
.v-capability .mx-refmix .mx-cell { vertical-align: top; }
.v-capability .mx-refmix .mx-cellbtn > * { display: block; }
.v-capability .mx-colname-plain { font-weight: 600; }
.v-capability .mx-pairs { margin-top: 14px; }
.v-capability .mx-pairs summary { cursor: pointer; }
.v-capability .mx-pairtable { border-collapse: collapse; font-size: 11px; }
.v-capability .mx-pairhead { height: 120px; vertical-align: bottom; padding: 2px 0; font-weight: 400; }
.v-capability .mx-pairhead span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-family: ui-monospace, monospace; }
.v-capability .mx-pairrow { text-align: right; font-weight: 400; font-family: ui-monospace, monospace; padding: 0 6px; white-space: nowrap; }
.v-capability .mx-pair { padding: 0; border: 1px solid var(--grid); text-align: center; }
.v-capability .mx-pairbtn { width: 22px; height: 22px; min-height: 22px; padding: 0; border: none; border-radius: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
.v-capability .mx-pair.v-served .mx-pairbtn { color: var(--good); } .v-capability .mx-pair.v-marginal .mx-pairbtn { color: var(--warn); } .v-capability .mx-pair.v-impossible .mx-pairbtn { color: var(--bad); }
.v-capability .mx-pairbtn:hover { background: var(--page); }
.v-capability .mx-pair.v-impossible { background: var(--page); }
@media (max-width: 599px) {
  .v-capability .mx-allpts { display: inline-block; min-height: 32px; }
  .v-capability:not(.show-all) .mx-table .mx-col:not(.mx-focus-col) { display: none; }
  .v-capability .mx-wlcol { min-width: 120px; }
}

/* Timing styles. Scope every selector under .v-timing; colours only through tokens. */
.v-timing .tm-sec { margin: 0 0 22px; }
.v-timing .tm-sec h2 { font-size: 16px; margin: 0 0 6px; }
.v-timing .tm-sec h3 { font-size: 13px; margin: 10px 0 4px; }
.v-timing .tm-na { opacity: .85; }
.v-timing .tm-chart { overflow-x: auto; max-width: 100%; }
.v-timing .tm-chart svg { min-width: 560px; max-width: 100%; }
.v-timing .legend { font-size: 12px; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.v-timing .lg i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border: 1px solid var(--axis); }
.v-timing .lnk { border: none; background: none; padding: 0; min-height: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
.v-timing .tm-tbl summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.v-timing svg text.in { fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.v-timing svg .seg { cursor: pointer; }
.v-timing svg .seg rect { stroke: var(--surface); stroke-width: 1; }
.v-timing svg .seg:hover rect, .v-timing svg .seg:focus rect { stroke: var(--ink); stroke-width: 2; }
.v-timing .k-pad { background: var(--s1); } .v-timing .k-sync { background: var(--s2); } .v-timing .k-sm { background: var(--s3); }
.v-timing .k-out { background: var(--s4); } .v-timing .k-ext { background: var(--s5); } .v-timing .k-host { background: var(--s6); }
.v-timing .k-lane { background: var(--s7); }

88,"id":"read_1w","label":"read, 1 word","note":"verif/perf/hostport.py:141 passes the 4 TA/dummy bytes in MOSI and n_miso=4: 80 SCK rises instead of 48"},{"a":null,"a_what":null,"b":1604.0,"class":"BUG-B","framing":1348,"id":"rxf0_burst_4","label":"RXF0 burst, 4 words","note":"same cause as read_1w"},{"a":null,"a_what":null,"b":68.0,"class":"agree","framing":68,"id":"cmd_only","label":"CMD byte only","note":""},{"a":7233.0,"a_what":"to h","b":null,"class":"agree","framing":7233,"id":"imem_burst_28w","label":"IMEM burst, 28 words","note":"framing h = k*(8 + 32n) - k/2 + 5"}],"isa":{"effects":[{"cite":[{"path":"fw/can/CANNOT-EXPRESS.md","quote":"30+ instructions per data bit for the XOR alone"},{"path":"fw/can/CANNOT-EXPRESS.md","quote":"**the MVP instruction set has no XOR**"},{"path":"tools/archsim/PLAN.md","quote":"25 M+J (can_tx 5 + stuff detector 20, fw/can/CANNOT-EXPRESS.md)"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":10,"lo":3,"nom":4},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":18,"lo":6,"nom":10},"enables":["isa_xor"],"lever":"isa_xor","method":"judgement","program":null,"rationale":"CRC-15 step per received bit with the XOR operation, anchored on fw/can/CANNOT-EXPRESS.md which counts the same step at 30+ instructions per bit without it. Sketch with the assumed XOR (op 11, dst ^= src): the running CRC lives left-justified in the OSR, the polynomial (left-justified) in Y. Per data bit: `out x, 1` (X = CRC msb; the OUT also shifts the register, so the shift is free), `mov x, x ^ pins` (fold in the line bit), `jmp !x, next`, `mov osr, osr ^ y` = 4 instructions per bit, versus the 30+ instructions per bit for the XOR alone that CANNOT-EXPRESS.md counts without it. Plus set-up and the final compare/ACK (about 6 words). Register pressure is the uncertainty: fw/can's stuff detector already uses the OSR as its window source, so the CRC may have to be spilled through the ISR (more words and cycles), hence the wide high end. The shipped can_tx loop (5 words) plus stuff detector (20 words) already use 25 of 32 IMEM words, so +10 words is 35: it does NOT fit at the nominal count and fits only at the low end (+6 = 31).","src":"J: hand sketch scaled from fw/can/CANNOT-EXPRESS.md (CRC-15 feedback count without XOR)","status":"judgement","wl":"can_1m"},{"cite":[{"path":"fw/can/CANNOT-EXPRESS.md","quote":"30+ instructions per data bit for the XOR alone"},{"path":"fw/can/CANNOT-EXPRESS.md","quote":"**the MVP instruction set has no XOR**"},{"path":"docs/brief/stretch/budget.py","quote":"CAN FD RX stuff detect + ACK"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":10,"lo":3,"nom":4},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":18,"lo":6,"nom":10},"enables":["isa_xor"],"lever":"isa_xor","method":"judgement","program":null,"rationale":"CAN FD uses CRC-17/CRC-21 instead of CRC-15: the same shift-and-conditional-XOR step with a different left-justified polynomial constant, so the can_1m count is reused unchanged (4 instructions per bit, about 10 words with set-up and compare). The workload already needs 38 words for stuff detect + ACK (docs/brief/stretch/budget.py), so the extra words are not absorbed; the bit time at 5 Mbit/s is 10 core cycles, so the added cycles are not hidden either. Scaled, not counted: no CAN FD CRC program exists.","src":"J: scaled from the can_1m isa_xor row (same step, CRC-17/21 polynomials)","status":"judgement","wl":"canfd_5m"},{"cite":[{"path":"docs/brief/stretch/budget.py","quote":"USB deadlines: 7.5 bit times device delay"},{"path":"fw/can/CANNOT-EXPRESS.md","quote":"**the MVP instruction set has no XOR**"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":10,"lo":3,"nom":4},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":18,"lo":5,"nom":10},"enables":[],"lever":"isa_xor","method":"judgement","program":null,"rationale":"USB low speed needs CRC5 on tokens and CRC16 on data (the device must check CRC16 before ACK). Same 4-instruction step per bit as the can_1m row, anchored on fw/can/CANNOT-EXPRESS.md (right-shifting form changes the polynomial constant, not the count), two constants and two compares so about 10 words. The workload table has needs_xor false (the CRC is not on the autonomous reply path), so this row enables no limit: it records cost only, not a benefit.","src":"J: scaled from the can_1m isa_xor row; two polynomials (CRC5 token, CRC16 data)","status":"judgement","wl":"usb_ls_device"},{"cite":[{"path":"docs/brief/stretch/budget.py","quote":"USB deadlines: 7.5 bit times device delay"},{"path":"fw/can/CANNOT-EXPRESS.md","quote":"**the MVP instruction set has no XOR**"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":10,"lo":3,"nom":4},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":18,"lo":5,"nom":10},"enables":[],"lever":"isa_xor","method":"judgement","program":null,"rationale":"Same CRC5/CRC16 step as usb_ls_device (4 instructions per bit, about 10 words), scaled from the can_1m row in fw/can/CANNOT-EXPRESS.md terms. At 12 Mbit/s a bit is about 4 core cycles at 50 MHz and the workload already spends 5 instructions per bit, so the added cycles cannot be hidden; needs_xor is false, so no limit is enabled and the row is cost only.","src":"J: scaled from the can_1m isa_xor row; two polynomials (CRC5 token, CRC16 data)","status":"judgement","wl":"usb_fs_device"},{"cite":[{"path":"tools/archsim/PLAN.md","quote":"14 J (fw/manchester 11 M)"},{"path":"fw/can/CANNOT-EXPRESS.md","quote":"**the MVP instruction set has no XOR**"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":10,"lo":3,"nom":4},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":14,"lo":5,"nom":8},"enables":[],"lever":"isa_xor","method":"judgement","program":null,"rationale":"CRC-32 FCS generated on chip while transmitting: one step per bit (the same 4-instruction sketch as can_1m, a 32-bit register in the OSR) plus appending the 32 result bits; about 8 words. No byte-wise table exists (IMEM is not readable, per fw/can/CANNOT-EXPRESS.md). At 10 Mbit/s a bit is 5 core cycles at 50 MHz against 3 instructions per bit already, so the added cycles are not hidden. needs_xor is false (the host appends the FCS today), so no limit is enabled: cost only.","src":"J: scaled from the can_1m isa_xor row (CRC-32 FCS on transmit, one bit at a time)","status":"judgement","wl":"eth10_tx"},{"cite":[{"path":"tools/archsim/PLAN.md","quote":"| eth10_rx | rx | own"},{"path":"fw/can/CANNOT-EXPRESS.md","quote":"**the MVP instruction set has no XOR**"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":10,"lo":3,"nom":4},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":18,"lo":6,"nom":10},"enables":[],"lever":"isa_xor","method":"judgement","program":null,"rationale":"CRC-32 FCS check while receiving (anchor fw/can/CANNOT-EXPRESS.md): the can_1m step per bit (4 instructions, 32-bit register) plus the final residue compare, about 10 words. The workload already lists 45 words, over the 32-word IMEM, so the row adds to a program that does not fit and cannot rescue it. needs_xor is false: cost only.","src":"J: scaled from the can_1m isa_xor row (CRC-32 FCS check on receive)","status":"judgement","wl":"eth10_rx"},{"cite":[{"path":"fw/uart_rx/program.pio","quote":"set     x, FRAMING_ERROR"},{"path":"fw/uart_rx/program.pio","quote":"`irq 4 rel`, which is a NOP on this chip: harmless, but the framing-error"},{"path":"docs/mvp-isa.md","quote":"3. No IRQ flags: the IRQ instruction is a NOP, `wait 1 irq` stalls forever, `wait 0 irq` passes,"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":0,"lo":0,"nom":0},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":0,"lo":-2,"nom":-2},"enables":[],"lever":"isa_irq","method":"judgement","program":"fw/uart_rx/program.pio","rationale":"A two-engine hand-over might be expected here, but the shipped TX and RX engines (fw/uart_rx/program.pio and fw/uart_tx) are independent: nothing hands off. The only effect found is the framing-error flag that the header says was dropped with `irq 4 rel`: lines 85-90 (`push block`, `set x, FRAMING_ERROR`, `mov isr, x`, `push block`, `jmp idle`, 5 words) become `push block`, `irq 4`, `jmp idle` (3 words), -2 words, on the error path only so no change per bit. Upper bound 0 if the host still wants the marker word. The IRQ flag also needs a host-visible flag register that this repo does not specify.","src":"J: hand rewrite of fw/uart_rx/program.pio:85-90 (framing_error path)","status":"estimate","wl":"uart_3m"},{"cite":[{"path":"tools/archsim/PLAN.md","quote":"reflex_sm 8 (J: 3-opcode bit tree, K27)"},{"path":"docs/mvp-isa.md","quote":"`101` `X!=Y`; `110` `PIN` (input pin"}],"d_decide_sm":{"hi":0,"lo":-1,"nom":0},"d_ipu":{"hi":0,"lo":-1,"nom":0},"d_reflex_sm":{"hi":-2,"lo":-6,"nom":-4},"d_words":{"hi":-4,"lo":-16,"nom":-10},"enables":[],"lever":"isa_cond","method":"judgement","program":null,"rationale":"No program exists. The workload's reflex_sm 8 is a judgement for a 3-opcode bit tree (tools/archsim/PLAN.md Appendix A.3): in M0 each opcode test is a constant load (SET holds only 5 bits, so an 8-bit command needs a multi-instruction load) plus `jmp x != y`, about 3-4 SM cycles per level; with x == imm and pin-edge conditions each test is one instruction. Assumed 12-20 of the 40 words and 6-10 of the 8 cycles are tree overhead, so -10 words (-16 to -4) and -4 cycles (-6 to -2). The repo does not itemise the 40 words: this is a wide guess; at 40-10 = 30 words the program would fit 32, at -4 (36) it would not.","src":"J: no program; scaled from the workload's own judgement (reflex_sm 8, 40 words, 3-opcode bit tree)","status":"judgement","wl":"spi_flash_read_decode"},{"cite":[{"path":"fw/i2c_target/program.pio","quote":"jmp !x, stop_path              ; out of patience: the bus went free"},{"path":"fw/i2c_target/program.pio","quote":"set x, POLL                    ; patched by the host: see POLL above"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":0,"lo":-1,"nom":0},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":0,"lo":-3,"nom":-2},"enables":[],"lever":"isa_cond","method":"judgement","program":"fw/i2c_target/program.pio","rationale":"fw/i2c_target/program.pio lines 154-160 (`set x, POLL` plus the 4-word poll loop `jmp pin, counted` / `jmp data` / `jmp !x, stop_path` / `jmp x-- poll`, 5 words, 3 SM cycles per iteration) recognise a STOP by timing out. With a pin-edge condition (SDA rising while SCL is high) the loop becomes `jmp edge, stop_path` / `jmp pin, poll` / `jmp data` (3 words, 2 SM cycles), no counter and no patched constant: -2 words (-3 to 0 depending on whether the edge latch needs a clearing instruction). The poll runs once per byte, so per-bit instructions change by at most -0.5. The reflex path (wait to out pindirs) is untouched.","src":"J: hand rewrite of fw/i2c_target/program.pio:154-160 (timeout poll loop)","status":"estimate","wl":"i2c_target_fmplus"},{"cite":[{"path":"fw/i2c/program.pio","quote":"set x, 8 side 1                     ; eight bit times left after the first one, so"},{"path":"fw/i2c/program.pio","quote":"jmp !y idle side 1                 ; no words left"}],"d_decide_sm":{"hi":0,"lo":0,"nom":0},"d_ipu":{"hi":0,"lo":0,"nom":0},"d_reflex_sm":{"hi":0,"lo":0,"nom":0},"d_words":{"hi":0,"lo":-1,"nom":0},"enables":[],"lever":"isa_cond","method":"judgement","program":"fw/i2c/program.pio","rationale":"The controller in fw/i2c/program.pio has no poll loop (the plan named the i2c_target one): it counts bits with `set x, 8` / `jmp x-- bitloop` and bytes with `jmp !y idle` / `jmp y-- bitloop` (lines 108-120). M0 already has `jmp x--`, `jmp !y` and `jmp !osre`, so no new condition replaces any of them; the only conceivable saving is one word if a compare-with-immediate folded the `set x, 8` into the jump. Nominal effect zero, low end -1.","src":"J: reading of fw/i2c/program.pio:108-120 (bit and byte counters)","status":"estimate","wl":"fw_i2c"},{"cite":[{"path":"fw/i2c_target/program.pio","quote":"mov isr, x                    ; and forget it: PUSH_THRE // archsim model (Tasks 4-6: core, limits, solvers and calibration). Dependency-free, deterministic, no DOM, no clock, no randomness.
// Formulas and structure live here; every number a data file can carry comes from `data` (inputs.json).
// Units: time ns, clocks MHz, area um2, bandwidth MB/s (= bytes/us), sizes bytes or words. PLAN Part 2.
var ArchSim = (function () {
  'use strict';
  var VERSION = '2';

  // ---------------------------------------------------------------- JSON helper (PLAN 4.4)
  // Maps +-Infinity to strings so JSON.stringify round-trips.
  function toJSON(x) {
    if (typeof x === 'number') {
      if (x === Infinity) return 'Infinity';
      if (x === -Infinity) return '-Infinity';
      return x;
    }
    if (Array.isArray(x)) return x.map(toJSON);
    if (x && typeof x === 'object') {
      var o = {};
      Object.keys(x).forEach(function (k) { o[k] = toJSON(x[k]); });
      return o;
    }
    return x;
  }

  // ---------------------------------------------------------------- knobs (PLAN 2.1)
  // Appendix D lists the same defaults for the `mvp` preset; defaultArch() is built from KNOBS.
  var GROUPS = ['Clock & timing', 'Engines & memory', 'I/O & host', 'Die', 'Environment', 'ISA'];
  // Identifiers of the area-only blocks of Appendix B.5 (the areas themselves are in data.blocks).
  var EXTRA_IDS = ['echo_comparator', 'pin_shadow_witness24', 'replay_module_18', 'fc_executor',
    'sched_shared_datapath', 'fc_table_sram_512B'];

  function num(id, label, g, def, min, max, step, unit, help, quick) {
    var k = { id: id, label: label, type: 'number', min: min, max: max, step: step, default: def, unit: unit, group: g, help: help };
    if (quick) k.quick = quick;
    return k;
  }
  function en(id, label, g, def, options, unit, help) {

  }

  }
  var KNOBS = [
    num('f_core_mhz', 'Core clock', GROUPS[0], 50, 10, 80, 0.5, 'MHz', 'Supplied by the board MCU (exact at 48/50/60).', [48, 50, 60]),

    num('n_engines', 'Engines', GROUPS[1], 2, 1, 6, 1, '', 'Number of PIO engines.'),
    en('imem_words', 'IMEM words per engine (per bank)', GROUPS[1], 32, [32, 64, 128, 256, 512], '16-bit words', ''),
    en('imem_tech', 'IMEM technology', GROUPS[1], 'flop', ['flop', 'latch', 'sram2p'], '', 'sram2p is a two-port macro (a 1RW pair is behaviourally wrong).'),
    en('imem_paging', 'IMEM paging', GROUPS[1], 'none', ['none', 'bank_switch', 'host_reload'], '', ''),
    num('imem_banks', 'IMEM banks (bank_switch)', GROUPS[1], 1, 1, 8, 1, '', 'Physical words = imem_words * imem_banks.'),
    num('fifo_depth', 'Flop FIFO depth (each TX and RX FIFO)', GROUPS[1], 4, 2, 16, 1, '32-bit words', 'Per FIFO, every engine.'),
    en('deep_fifo_words', 'Deep SRAM-backed FIFO', GROUPS[1], 0, [0, 64, 256, 512, 1024, 2048, 4096], '32-bit words', 'One extra SRAM FIFO behind the flop FIFO.'),

    num('pins_reserved', 'Pins reserved (debug, IRQ, spare)', GROUPS[2], 0, 0, 6, 1, 'pins', ''),

    { id: 'isa_xor', short: 'CRC unit', label: 'On-chip CRC for an autonomous reply', unit: 'flag',
      applies: 'needs_xor', formula: '(crc_unit or (isa_xor and the isa_xor effect row enables isa_xor)) ? +1 : -1',
      check: function (c) {

  // Chip-level items (PLAN-v2 2.1): evaluated once per architecture point by chipCheck, never inside a cell.
  var CHIP_ITEMS = [
    { id: 'core_clock', short: 'core clock', label: 'Core clock vs fmax', unit: 'MHz',
      applies: 'always', formula: 'fmax_<signoff_corner> - f_core_mhz',
      check: function (c) {

          terms: function () { return [dT('fmax', 'fmax_' + a.signoff_corner, ivl(d.fmax[a.signoff_corner]), 'MHz'), kT('f_core_mhz', a, 'f_core_mhz', 'MHz'), kT('signoff_corner', a, 'signoff_corner')]; } };

    { id: 'die_area', short: 'die area', label: 'Area vs usable die', unit: 'um2',

      check: function (c) {

          note: 'every block band, pnr_factor and macro_halo are vertex inputs' };

    { id: 'board_clock', short: 'board clock', label: 'Core clock vs board clock limit', unit: 'MHz',
      applies: 'always', formula: 'f_ext_clk_max - f_core_mhz',
      check: function (c) {

          terms: function (V) { return [pt(c, 'f_ext_clk_max', 'f_ext_clk_max_mhz', V), kT('f_core_mhz', c.arch, 'f_core_mhz', 'MHz')]; } };
      } },
    { id: 'isa_encoding', short: 'ISA encoding', label: 'Opcode room for the ISA levers', unit: 'slots',
      applies: 'an ISA lever is on', formula: 'min(major_free - sum major slots, minor_free - sum minor slots) at isa_word_bits',
      check: function (c) {

        var isa = c.data.isa, enc = isa.encoding[a.isa_word_bits], used = { major: 0, minor: 0 }, terms = [kT('isa_word_bits', a, 'isa_word_bits', 'bits')];

      } },
    { id: 'pins_budget', short: 'pins', label: 'Project pins left after the host link and reserved pins', unit: 'pins',
      applies: 'always', formula: 'ui_in + uo_out + uio - link.pins_in - link.pins_out - pins_reserved',
      check: function (c) {

          terms: function () { return [dT('pins_total_avail', 'pins_total_avail', c.d.pins.total_avail, 'pins')]; },

  function limits() {
    return LIMITS.map(function (L) { return { id: L.id, short: L.short, label: L.label, unit: L.unit, applies: L.applies, formula: L.formula }; });
  }
  function chipItems() {
    return CHIP_ITEMS.map(function (L) { return { id: L.id, short: L.short, label: L.label, unit: L.unit, formula: L.formula }; });
  }

  function findWl(wl, data) {
    if (typeof wl !== 'string') return wl;
    var w = data.workloads.filter(function (x) { return x.id === wl; })[0];
    if (!w) throw new Error('unknown workload ' + wl);
    return w;
  }

  // Everything a limit needs about (arch, workload): derived quantities, unit/edge, flags, cell-level records.
  function cellContext(archIn, wlIn, data, opts) {
    opts = opts || {};
    var wl = findWl(wlIn, data);
    var d = opts.derived || derive(archIn, data);
    var arch = d.arch;
    var c = { arch: arch, d: d, wl: wl, P: d.params, opts: opts, T: d.T, data: data, records: {},
      TIN: data.iss.T_IN, TOUT: data.iss.T_OUT, snap_tol: 1e-6 };
    c.unit = 1e9 / wl.rate_hz;
    c.edge = wl.edge_ns != null ? wl.edge_ns : c.unit;
    c.lane = !!arch.lane && wl.clocking === 'bus_clock_in' && wl.role === 'target';
    // ISA levers: the active levers' effect rows for this workload (judgement); nominal effective counts drive the discrete
    // decisions (streaming, divider, host-link stream), the bands enter the limits as pseudo-parameters isa_d_<field>
    c.isa = isaOf(arch, wl.id, data);

    c.reflex_sm = wl.reflex_sm + c.isa.d_reflex_sm.nom; c.decide_sm = wl.decide_sm + c.isa.d_decide_sm.nom;
    c.stream = arch.streaming === 'out_exec' && c.words > arch.imem_words * arch.imem_banks;
    var R = c.records;
    R.unit_ns = rec('unit_ns', 'Unit interval', c.unit, 'ns', '1e9 / rate_hz', [wf(wl, 'rate_hz', 'rate_hz', 'Hz')]);
    R.edge_ns = rec('edge_ns', 'Shortest edge interval', c.edge, 'ns', 'edge_ns ?? unit_ns', [wf(wl, 'edge_ns', 'edge_ns', 'ns'), dT('unit', 'unit_ns', c.unit, 'ns')]);
    if (wl.resp_ns != null || wl.resp_bits != null) {

      R.response_deadline_ns = rec('response_deadline_ns', 'Response deadline', rd, 'ns', 'resp_ns ?? resp_bits * unit_ns',
        [wf(wl, 'resp_ns', 'resp_ns', 'ns'), wf(wl, 'resp_bits', 'resp_bits', 'bits'), dT('unit', 'unit_ns', c.unit, 'ns')]);
    }
    if (wl.reflex_ns != null || wl.reflex_bits != null) {

      R.reflex_deadline_ns = rec('reflex_deadline_ns', 'Reflex deadline', fd, 'ns', 'reflex_ns ?? reflex_bits * unit_ns',
        [wf(wl, 'reflex_ns', 'reflex_ns', 'ns'), wf(wl, 'reflex_bits', 'reflex_bits', 'bits'), dT('unit', 'unit_ns', c.unit, 'ns')]);

  // Limits that are about time (shown on the Timing tab and in its cross-point strip); flagged on every limit record.
  var TIMING_IDS = ['reflex', 'response', 'tx_edge', 'round_trip', 'rate_quant', 'rx_osr', 'rx_eye', 'rx_timestamp', 'pad_toggle_out', 'pad_toggle_in'];
  function evalOne(L, c) {
    var s = L.check(c);
    if (s.na) return { na: c.opts.lite ? true : { id: L.id, label: L.label, short: L.short, reason: s.na } };
    var V;
    if (Object.keys(s.inputs).length) V = vertex(s.inputs, s.f, 'high');
    else { var n = s.f({}); V = { nom: n, pess: n, opt: n, pess_direction: {} }; }
    var r = c.opts.lite ? { id: L.id, label: L.label, value: { nom: V.nom, pess: V.pess, opt: V.opt }, unit: s.unit || L.unit }
      : rec(L.id, L.label, V, s.unit || L.unit, s.formula || L.formula, s.terms(V), s.note);

  }

  // evaluateCell(arch, wl, data, opts): 2.6. `wl` is a workload object or id. opts: derived (cache), force_snap,
  // link_override_MBps, mismatch_single_sided (calibration only).
  function evaluateCell(archIn, wlIn, data, opts) {
    var c = cellContext(archIn, wlIn, data, opts);
    var lim = [], nas = [];
    LIMITS.forEach(function (L) {
      var o = evalOne(L, c);
      if (o.na) { if (o.na !== true) nas.push(o.na); } else lim.push(o.rec);
    });
    var verdict = 'served';
    lim.forEach(function (r) {   // per-limit verdict: the same test as the cell's, applied to this limit alone
      r.verdict = r.value.opt < -slack(r.scale) ? 'impossible' : (r.value.pess < -slack(r.scale) ? 'marginal' : 'served');
      if (r.value.opt < -slack(r.scale)) verdict = 'impossible';
      else if (r.value.pess < -slack(r.scale) && verdict !== 'impossible') verdict = 'marginal';
    });
    var order = lim.map(function (r, i) { return i; });
    order.sort(function (a, b) { return (lim[a].rel < lim[b].rel ? -1 : (lim[a].rel > lim[b].rel ? 1 : a - b)); });  // ties: table order
    var ranked = order.map(function (i) {
      var r = lim[i];
      return { id: r.id, short: r.short, nom: r.value.nom, pess: r.value.pess, opt: r.value.opt, rel: r.rel, unit: r.unit };
    });
    var scaleOf = {};
    lim.forEach(function (r) { scaleOf[r.id] = r.scale; });

    // binding = the limit that explains the verdict: for an impossible cell the smallest-rel limit among blocked_by; otherwise
    // the overall smallest-rel limit. `closest` is always the overall smallest-rel limit.
    var closest = lim[order[0]];
    var bind = blocked.length ? lim[order.filter(function (i) { return lim[i].id === blocked[0]; })[0]] : closest;
    return {
      wl: c.wl.id, verdict: verdict, binding: bind.id, closest: closest.id,
      headline: { limit: bind.id, short: bind.short, nom: bind.value.nom, pess: bind.value.pess, opt: bind.value.opt, unit: bind.unit, rel: bind.rel },
      limits: lim, ranked: ranked, blocked_by: blocked, na: nas, records: c.opts.lite ? {} : c.records, flags: { lane_serves: c.lane, streaming_active: c.stream }
    };
  }

  // chipCheck (PLAN-v2 2.1): chip-level items evaluated once per architecture point.
  function chipCheck(archIn, data, opts) {
    opts = opts || {};
    var d = opts.derived || derive(archIn, data);
    var c = { arch: d.arch, d: d, P: d.params, data: data, opts: opts };
    var items = [], records = {};

      var o = evalOne(L, c);

    var key = function (it) { return verdict === 'marginal' ? it.rel_pess : it.rel; };
    var best = pool.reduce(function (b, it) { return key(it) < key(b) ? it : b; }, pool[0]);

  function evaluateAll(archIn, data, filterTag, opts) {
    opts = opts || {};
    var d = derive(archIn, data);
    var cells = {}, counts = { served: 0, marginal: 0, impossible: 0 };
    var by = { served: [], marginal: [], impossible: [] };
    data.workloads.forEach(function (w) {
      if (filterTag && filterTag !== 'all' && (w.tags || []).indexOf(filterTag) < 0) return;
      var cell = evaluateCell(d.arch, w, data, { derived: d, lite: !!opts.lite });

  }

  // For the monotonicity test (3.2): each applicable limit's margin at n evenly spaced values of every used
  // input between lo and hi, the others at nominal.
  function sensitivity(archIn, wlIn, data, n) {
    var c = cellContext(archIn, wlIn, data, {}), out = [];
    LIMITS.concat(CHIP_ITEMS).forEach(function (L) {
      var s = L.check(c);
      if (s.na) return;
      Object.keys(s.inputs).forEach(function (k) {
        var u = s.inputs[k];
        if (u.lo === u.hi) return;
        var xs = [], ms = [];
        for (var i = 0; i < n; i++) {
          var v = {};
          Object.keys(s.inputs).forEach(function (q) { v[q] = s.inputs[q].nom; });
          v[k] = u.lo + (u.hi - u.lo) * i / (n - 1);
          xs.push(v[k]); ms.push(s.f(v));
        }
        out.push({ limit: L.id, input: k, x: xs, margin: ms });
      });
    });
    return out;
  }

  // ================================================================ Task 6: solvers, calibration, diagrams
  var MAXRATE_LO = 1e3, MAXRATE_HI = 1e9, MAXRATE_ITER = 60;  // PLAN 2.7
  var VERTICES = ['nom', 'pess', 'opt'];

  function vertexTriple(fn) { return { nom: fn('nom'), pess: fn('pess'), opt: fn('opt') }; }

  // {id, scale, nom, pess, opt} of one limit in a cell context; null if it does not apply.
  function limitTriple(L, c) {
    var s = L.check(c);
    if (s.na) return null;
    var V;
    if (Object.keys(s.inputs).length) V = vertex(s.inputs, s.f, 'high');
    else { var n = s.f({}); V = { nom: n, pess: n, opt: n }; }
    return { id: L.id, scale: s.scale, nom: V.nom, pess: V.pess, opt: V.opt };
  }

  // The limits failing (< 0 at `vx`) for workload `wl`, sorted by margin / |scale| (smallest first).
  function failingAt(d, wl, data, vx, opts, skip, only) {
    var c = cellContext(d.arch, wl, data, Object.assign({}, opts, { derived: d }));
    var fails = [];
    LIMITS.forEach(function (L) {
      if (skip.indexOf(L.id) >= 0 || (only && only.indexOf(L.id) < 0)) return;
      var t = limitTriple(L, c);
      if (!t || !(t[vx] < -slack(t.scale))) return;
      fails.push({ id: L.id, rel: t.scale ? t[vx] / Math.abs(t.scale) : -Infinity });
    });
    fails.sort(function (a, b) { return a.rel - b.rel; });
    return fails;
  }

  // maxRate (PLAN 2.7): largest rate_hz at which every applicable limit is >= 0 at `vertexName` (nom | pess | opt).
  // opts: skip (limit ids, default ['fixed_clock']), only (limit ids; calibration), plus the evaluateCell calibration
  // options. The lower bound is MAXRATE_LO, or a thousandth of the row's own rate when that is lower.
  function maxRate(archIn, wlIn, data, vertexName, opts) {
    opts = opts || {};
    var vx = vertexName || 'nom';
    if (VERTICES.indexOf(vx) < 0) throw new Error('vertex must be nom, pess or opt');
    var wl0 = findWl(wlIn, data), d = derive(archIn, data);
    var skip = opts.skip || ['fixed_clock'], only = opts.only || null;
    var at = function (r) { return failingAt(d, Object.assign({}, wl0, { rate_hz: r }), data, vx, opts, skip, only); };
    var lo = Math.min(MAXRATE_LO, wl0.rate_hz / 1e3), hi = MAXRATE_HI;

    if (!at(hi).length) return { rate_hz: hi, binding: null, vertex: vx };
    for (var i = 0; i < MAXRATE_ITER; i++) {

      if (at(mid).length) hi = mid; else lo = mid;
    }
    return { rate_hz: lo, binding: at(hi)[0].id, vertex: vx };
  }

  // Largest single-sided rate mismatch (%) for which rx_eye stays >= 0 at `vertexName` (K18).
  function rxTolerance(archIn, wlIn, data, vertexName) {
    var vx = vertexName || 'nom', wl0 = findWl(wlIn, data), d = derive(archIn, data);
    var L = LIMITS.filter(function (x) { return x.id === 'rx_eye'; })[0];
    var ok = function (tol) {
      var c = cellContext(d.arch, Object.assign({}, wl0, { rate_tol_pct: tol }), data, { derived: d, mismatch_single_sided: true });
      var t = limitTriple(L, c);
      return t === null ? null : t[vx] >= -slack(t.scale);
    };
    var first = ok(0);
    if (first === null) return null;
    if (!first) return 0;
    var lo = 0, hi = 100;
    if (ok(hi)) return Infinity;
    for (var i = 0; i < MAXRATE_ITER; i++) {
      var mid = (lo + hi) / 2;
      if (ok(mid)) lo = mid; else hi = mid;
    }
    return lo;
  }

  // Receive jitter (ns) at which rx_eye reaches 0 (nominal vertex): the eye budget left once spec jitter is removed (K19).
  function rxJitterBreakEven(archIn, wlIn, data) {
    var wl0 = findWl(wlIn, data), d = derive(archIn, data);
    var L = LIMITS.filter(function (x) { return x.id === 'rx_eye'; })[0];
    var ok = function (j) {
      var t = limitTriple(L, cellContext(d.arch, Object.assign({}, wl0, { rx_jitter_ns: j }), data, { derived: d }));
      return t.nom >= -slack(t.scale);
    };
    if (!ok(0)) return 0;
    var lo = 0, hi = wl0.edge_ns != null ? wl0.edge_ns : 1e9 / wl0.rate_hz;
    for (var i = 0; i < MAXRATE_ITER; i++) {
      var mid = (lo + hi) / 2;
      if (ok(mid)) lo = mid; else hi = mid;
    }
    return lo;
  }

  // ---------------------------------------------------------------- sweep, pareto (PLAN 2.7)
  function splitTag(s) { var i = s.indexOf(':'); return i < 0 ? [s, null] : [s.slice(0, i), s.slice(i + 1)]; }

  // Cells counted per vertex: a cell counts at `nom` / `pess` / `opt` when every limit is >= 0 at that vertex.
  function countsByVertex(arch, data, tag) {
    var ev = evaluateAll(arch, data, tag || 'all');
    var out = { served: { nom: 0, pess: 0, opt: 0 }, marginal: 0, impossible: 0, total: 0 };
    Object.keys(ev.cells).forEach(function (id) {
      var cell = ev.cells[id];
      out.total++;
      VERTICES.forEach(function (v) {
        if (cell.limits.every(function (r) { return r.value[v] >= -slack(r.scale); })) out.served[v]++;
      });
      if (cell.verdict === 'marginal') out.marginal++;
      else if (cell.verdict === 'impossible') out.impossible++;
    });
    return out;
  }

  function metricAt(arch, metric, data) {
    var parts = splitTag(metric), kind = parts[0], rest = parts[1];
    if (kind === 'served_count') return countsByVertex(arch, data, rest).served;
    if (kind === 'marginal_count') { var m = countsByVertex(arch, data, rest).marginal; return { nom: m, pess: m, opt: m }; }
    var d = derive(arch, data);
    if (kind === 'chip_margin') {
      var ci = chipCheck(d.arch, data, { derived: d, lite: true }).items.filter(function (x) { return x.id === rest; })[0];
      if (!ci) throw new Error('unknown chip item ' + rest);
      return ivl(ci.value);
    }
    switch (kind) {
      case 'area_um2': return ivl(d.area.total);
      case 'util_pct': return ivl(d.area.util_pct);
      case 'fmax_typ': return ivl(d.fmax.typ);
      case 'fmax_slow': return ivl(d.fmax.slow);
      case 'link_write_MBps': return ivl(d.link.write_MBps);
      case 'link_read_MBps': return ivl(d.link.read_MBps);
      case 'max_rate':
        return vertexTriple(function (v) { return maxRate(d.arch, rest, data, v).rate_hz; });
      case 'margin': {
        var q = splitTag(rest);
        if (CHIP_ITEMS.some(function (L) { return L.id === q[1]; })) throw new Error('chip item, not a protocol limit: use chip_margin:' + q[1]);
        var cell = evaluateCell(d.arch, q[0], data, { derived: d });
        var r = cell.limits.filter(function (x) { return x.id === q[1]; })[0];
        return r ? ivl(r.value) : { nom: null, pess: null, opt: null };
      }
      default: throw new Error('unknown metric ' + metric);

  function head(title, sub) { return '<h2>' + esc(title) + (sub ? ' <span class="muted">' + sub + '</span>' : '') + '</h2>'; }

  // ------------------------------------------------------------ 0. cross-point strip: the focused protocol's timing on every point
  // The single home of the cross-point timing summary. It shows only margins, the binding timing limit and its verdict, per
  // point; the segments behind them are in the budget below (focused point only).
  function stripRow(state, pt) {
    var wl = state.focus.wl, cell = pt.all.cells[wl] || A.evaluateCell(pt.arch, wl, state.data, { derived: pt.derived });
    var tl = cell.limits.filter(function (l) { return l.timing; });
    var dl = tl.filter(function (l) { return l.id === 'reflex'; })[0] || tl.filter(function (l) { return l.id === 'response'; })[0];
    var blocking = tl.filter(function (l) { return l.verdict === 'impossible'; }), pool = blocking.length ? blocking : tl;

      esc(bind.short) + ' ' + fmtBandHtml(bind.value, bind.unit, 1),

  function stripSection(state) {

      '<p class="muted small">Margins are nominal (pessimistic..optimistic). Pick a point to see its segments below.</p></section>';

  // ------------------------------------------------------------ 1. reflex / response budget (one merged chart)
  function chartRows(tl) {
    var rows = [{ name: tl.lane ? 'sampled path' : tl.kind + ' path', segs: tl.segments, total: tl.total, attr: 'lat', path: 'lat' }];
    if (tl.lane) rows.push({ name: 'lane path (serves)', segs: tl.lane.segments, total: tl.lane.total, attr: 'lane', path: 'lane' });
    return rows;
  }
  function budgetChart(tl, col) {
    var rows = chartRows(tl), W = 760, L = 120, R = 24, xmax = tl.deadline;
    rows.forEach(function (rw) {
      xmax = Math.max(xmax, rw.total.pess, rw.total.opt, rw.total.nom, rw.segs[rw.segs.length - 1].t1);
    });
    xmax *= 1.06;
    var sx = function (t) { return L + (W - L - R) * t / xmax; };

      tl.ticks.forEach(function (t) {
        s += '<line class="clk" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="34" y2="' + (H - 34) + '" data-tick="' + n1(t) + '"/>';
      });
    }
    axisTicks(0, xmax, 7).forEach(function (t) {
      s += '<text x="' + sx(t) + '" y="' + (H - 18) + '" text-anchor="middle">' + fmtNum(t, 0) + '</text>';
    });
    s += '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - 32) + '" y2="' + (H - 32) + '"/>';
    s += '<text x="' + sx(xmax / 2) + '" y="' + (H - 4) + '" text-anchor="middle">time since the input edge (ns); thin lines = core clock ticks, T = ' + fmtNum(T, 2) + ' ns</text>';
    s += '<text x="' + (L - 8) + '" y="46" text-anchor="end">core clock</text>';
    var wave = 'M' + sx(0) + ' 48', hi = false;
    if (xmax / T < 600) {
      for (var t = 0; t <= xmax; t += T / 2) { wave += ' H' + sx(t) + ' V' + (hi ? 48 : 38); hi = !hi; }
      s += '<path class="wave" d="' + wave + '"/>';
    }
    rows.forEach(function (rw, ri) {
      var y = top + ri * rowH;
      s += '<text x="' + (L - 8) + '" y="' + (y + 17) + '" text-anchor="end">' + esc(rw.name) + '</text>';
      rw.segs.forEach(function (g, i) {
        var x0 = sx(g.t0), w = Math.max(1, sx(g.t1) - sx(g.t0));
        var lab = w > 78 ? g.label : (w > 30 ? fmtNum(g.dur, 2).replace(/\.?0+$/, '') : '');
        s += '<g class="seg ' + kindClass(g.kind) + '" tabindex="0" role="button"' +
          U.sideAttr({ kind: 'segment', path: rw.path, i: i, col: col }) + ' ' +
          (rw.attr === 'lat' ? 'data-seg-ns="' : 'data-lane-seg-ns="') + n1(g.dur) + '" data-seg="' + esc(g.label) + '">' +
          '<title>' + esc(g.label) + ': ' + fmtNum(g.dur, 2) + ' ns (t = ' + fmtNum(g.t0, 2) + ' to ' + fmtNum(g.t1, 2) + ')</title>' +
          '<rect x="' + x0 + '" y="' + y + '" width="' + w + '" height="26"/>' +
          (lab ? '<text class="in" x="' + (x0 + w / 2) + '" y="' + (y + 17) + '" text-anchor="middle">' + esc(lab.length > 14 && w < 110 ? lab.slice(0, 13) + '.' : lab) + '</text>' : '') + '</g>';
      });
      var wy = y + 38, lo = Math.min(rw.total.opt, rw.total.pess), hi2 = Math.max(rw.total.opt, rw.total.pess);
      s += '<g class="whisk" data-total-nom="' + n1(rw.total.nom) + '" data-total-pess="' + n1(rw.total.pess) + '" data-total-opt="' + n1(rw.total.opt) + '">' +
        '<line x1="' + sx(lo) + '" x2="' + sx(hi2) + '" y1="' + wy + '" y2="' + wy + '"/>' +
        '<line x1="' + sx(lo) + '" x2="' + sx(lo) + '" y1="' + (wy - 4) + '" y2="' + (wy + 4) + '"/>' +
        '<line x1="' + sx(hi2) + '" x2="' + sx(hi2) + '" y1="' + (wy - 4) + '" y2="' + (wy + 4) + '"/>' +
        '<line class="nomtick" x1="' + sx(rw.total.nom) + '" x2="' + sx(rw.total.nom) + '" y1="' + (wy - 6) + '" y2="' + (wy + 6) + '"/>' +
        '<text x="' + L + '" y="' + (wy + 18) + '">total ' + fmtNum(rw.total.nom, 1) + ' ns (opt ' + fmtNum(rw.total.opt, 1) + ', pess ' + fmtNum(rw.total.pess, 1) + ')</text></g>';
    });
    s += '<g class="deadline" data-deadline="' + n1(tl.deadline) + '"><line x1="' + sx(tl.deadline) + '" x2="' + sx(tl.deadline) + '" y1="26" y2="' + (H - 32) + '"/>' +
      '<text x="' + sx(tl.deadline) + '" y="20" text-anchor="middle">deadline ' + fmtNum(tl.deadline, 1) + ' ns</text></g>';

  }
  function budgetSection(state) {
    var wl = state.focus.wl, col = state.focus.col, tl = A.timeline(state.point.arch, wl, state.data), TITLE = 'Reflex / response budget';
    if (tl.kind === 'none') return na(TITLE, tl.reason, 'budget');
    var kinds = {}, legend = '';
    tl.segments.concat(tl.lane ? tl.lane.segments : []).forEach(function (g) {

    });
    var act = tl.lane ? tl.lane : tl;
    var segRow = function (path) {
      return function (g, i) {
        var p = paramOf(state, g.ref);
        return ['<button type="button" class="lnk"' + U.sideAttr({ kind: 'segment', path: path, i: i, col: col }) + '>' + esc(g.label) + '</button>',
          '<span class="num">' + fmtNum(g.t0, 2) + '</span>', '<span class="num">' + fmtNum(g.dur, 3) + '</span>',
          methodBadge(p ? p.method : g.ref.kind), '<span class="mono">' + esc(g.ref.id || g.ref.field || '') + '</span>'];

    };

    var tbl = tl.segments.map(segRow('lat'));

      (tl.lane ? ' <span class="muted">(the lane path serves; sampled-path margin ' + esc(fmtBand(tl.margin, 'ns', 1)) + ')</span>' : '') +

      U.table(HDR, tbl) + laneTbl + '</div></details></section>';
  }

  // ------------------------------------------------------------ 2. edge placement
  function edgeSection(state) {
    var TITLE = 'Edge placement on the TX grid', eg = A.edgeGrid(state.point.arch, state.focus.wl, state.data, 8);
    if (!eg.applicable) return na(TITLE, eg.reason, 'edge');
    var W = 760, L = 80, R = 20, tmax = eg.ideal[eg.ideal.length - 1] + eg.tick_ns * 1.2, H = 150;
    var sx = function (t) { return L + (W - L - R) * t / tmax; }, s = '';
    eg.ticks.forEach(function (t) { s += '<line class="clk" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="30" y2="100"/>'; });
    s += '<text x="' + (L - 8) + '" y="44" text-anchor="end">ideal</text><text x="' + (L - 8) + '" y="84" text-anchor="end">placed</text>';
    eg.ideal.forEach(function (t, k) {
      var p = eg.placed[k], e = eg.error[k];

        '<rect class="tol" x="' + sx(t - eg.tol_ns) + '" y="30" width="' + (sx(t + eg.tol_ns) - sx(t - eg.tol_ns)) + '" height="64"/>' +
        '<line class="ideal" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="34" y2="54"/><circle class="ideal" cx="' + sx(t) + '" cy="44" r="4"/>' +
        '<rect class="placed" x="' + (sx(p) - 4) + '" y="76" width="8" height="8"/>' +
        '<line class="err' + (Math.abs(e) > eg.tol_ns ? ' bad' : '') + '" x1="' + sx(t) + '" x2="' + sx(p) + '" y1="64" y2="64"/>' +
        '<text x="' + sx(t) + '" y="114" text-anchor="middle">' + (e === 0 ? '0' : (e > 0 ? '+' : '') + fmtNum(e, 1)) + '</text></g>';

      head(TITLE) + '<div class="tm-chart">' + U.svgWrap(W, H, s, 'Ideal against placed edges') + '</div><p>edge ' + fmtNum(eg.edge_ns, 2) + ' ns on a ' +
      fmtNum(eg.tick_ns, 2) + ' ns grid: ' + (eg.integer_grid ? 'integer multiple, every placed edge equals its ideal' : 'not an integer multiple, max error ' + fmtNum(eg.max_error_ns, 2) + ' ns') +
      (eg.limit ? '; tx_edge margin ' + fmtBandHtml(eg.limit, 'ns', 1) : '') + '</p></section>';
  }

  // ------------------------------------------------------------ 3. receive sampling
  function rxSection(state) {
    var TITLE = 'Receive sampling', arch = state.point.arch, r = A.rxSampling(arch, state.focus.wl, state.data);
    if (!r.applicable) return na(TITLE, r.reason, 'rx');
    var uLabel = arch.fine_edge === 'dtc' ? 'resolution u (delay-line tap)' : (r.capture === 'dpll' ? 'resolution u (T_rx / 2, DPLL)' : 'resolution u (T_rx)');
    var parts = [['u', uLabel, r.u.nom], ['drift', 'rate drift over the run', r.drift.nom], ['jitter', 'input jitter', r.jitter]];
    var total = parts.reduce(function (t, p) { return t + p[2]; }, 0), W = 760, L = 120, R = 30, xmax = Math.max(r.edge_half, total) * 1.12;
    var sx = function (t) { return L + (W - L - R) * t / xmax; }, s = '', x = 0, H = 120;
    axisTicks(0, xmax, 7).forEach(function (t) { s += '<line class="gridline" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="22" y2="76"/><text x="' + sx(t) + '" y="92" text-anchor="middle">' + fmtNum(t, 0) + '</text>'; });
    s += '<text x="' + sx(xmax / 2) + '" y="112" text-anchor="middle">ns of the half-edge interval that the sampler can lose</text>';
    s += '<text x="' + (L - 8) + '" y="49" text-anchor="end">consumed</text>';
    parts.forEach(function (p) {
      var w = Math.max(p[2] > 0 ? 1 : 0, sx(x + p[2]) - sx(x));
      s += '<g class="seg rx-' + p[0] + '" data-rx-part="' + p[0] + '" data-rx-ns="' + n1(p[2]) + '"><title>' + esc(p[1]) + ': ' + fmtNum(p[2], 3) + ' ns</title>' +
        '<rect x="' + sx(x) + '" y="32" width="' + w + '" height="26"/>' +
        (w > 40 ? '<text class="in" x="' + (sx(x) + w / 2) + '" y="49" text-anchor="middle">' + esc(p[0]) + ' ' + fmtNum(p[2], 2) + '</text>' : '') + '</g>';

    s += '<g class="deadline" data-rx-edge-half="' + n1(r.edge_half) + '"><line x1="' + sx(r.edge_half) + '" x2="' + sx(r.edge_half) + '" y1="22" y2="76"/>' +
      '<text x="' + sx(r.edge_half) + '" y="16" text-anchor="middle">edge / 2 = ' + fmtNum(r.edge_half, 2) + ' ns</text></g>';
    var legend = parts.map(function (p) { return '<span class="lg rx-' + p[0] + '"><i></i>' + esc(p[1]) + ' ' + fmtNum(p[2], 3) + ' ns</span>'; }).join('');
    var osr = r.osr && r.osr.need != null && r.osr.have
      ? '<p data-rx-osr>oversampling: ' + fmtBandHtml(r.osr.have, 'samples/bit', 2) + ' against ' + fmtNum(r.osr.need, 2) + ' needed (edge / T_rx).</p>'
      : '<p class="muted">Oversampling: no requirement, or the bus-clocked lane serves this protocol.</p>';
    return '<section class="tm-sec" data-sec="rx" data-rx-margin="' + n1(r.margin.nom) + '">' + head(TITLE, '(capture: ' + esc(r.capture) + ')') +
      '<div class="tm-chart">' + U.svgWrap(W, H, s, 'Receive eye budget: resolution, drift and jitter against half an edge interval') + '</div><div class="legend">' + legend + '</div>' +

  // ------------------------------------------------------------ 4. core clock vs fmax

        fmtBandHtml(p.ns, 'ns', 3), p.ref ? '<span class="mono">' + esc(p.ref.id) + '</span>' : '<span class="muted">none on this point</span>'];

  // ------------------------------------------------------------ 5. measured example

  // ------------------------------------------------------------ side kind 'segment'

      ' <button type="button" data-reset-all' + (nEdit ? '' : ' disabled') + '>reset all (' + nEdit + ' edited)</button></div>' +
      '<p class="muted">Edit lo / nom / hi; every view recomputes. A row must satisfy lo &lt;= nom &lt;= hi; it is applied when you press Enter or leave the row, in any edit order. Edits are kept in the page state (arch.param_overrides). ' +
      'Rows with status judgement, unverified, disputed or estimate are our guesses; the filter lists them.</p>' + note +
      '<div class="tbl"><table class="inputs-table"><thead><tr><th>parameter</th><th>lo</th><th>nom</th><th>hi</th><th>unit</th><th>method / status</th><th>citation</th><th>used by limits</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      notModelled(state);
  }

  // ------------------------------------------------------------ ISA estimates
  var EFFECT_FIELDS = [['d_words', 'IMEM words'], ['d_ipu', 'instructions per unit'], ['d_reflex_sm', 'reflex, SM cycles'], ['d_decide_sm', 'decision, SM cycles']];
  function effKey(e) { return e.lever + '@' + e.wl + (e.value !== undefined ? '@' + e.value : ''); }
  function effRef(e) { var r = { kind: 'isa_effect', wl: e.wl, lever: e.lever }; if (e.value !== undefined) r.value = e.value; return r; }
  function effectActive(state, e) {
    var a = state.points[0].arch[e.lever];
    return e.value !== undefined ? a === e.value : !!a;
  }
  function bandCell(b) { return b ? fmtBandHtml({ nom: b.nom, lo: b.lo, hi: b.hi }, '') : ''; }
  function renderIsa(state) {
    var I = state.data.isa || {}, effects = I.effects || [], levers = I.levers || {}, enc = I.encoding || {};
    var head = '<h2>ISA estimates</h2><p class="isa-warning" role="note"><b>These are estimates.</b> ' + esc(I.src || '') +
      ' Rows marked <i>judgement</i> are scaled from a neighbouring count; rows marked <i>estimate</i> come from a hand rewrite of a shipped program. The model uses them only when the lever is on.</p>';
    var m0 = '<h3>Already in M0 (not levers)</h3><ul class="isa-m0">' + (I.m0_present || []).map(function (m) {
      return '<li data-m0="1"><b>' + esc(m.feature) + '</b>' + citeBlock(m.cite) + '</li>'; }).join('') + '</ul>';
    var encT = U.table(['instruction width', 'free major opcodes', 'free minor slots', 'basis'], Object.keys(enc).map(function (b) {
      var e = enc[b];
      return ['<span class="num">' + esc(b) + ' bit</span>', '<span class="num">' + esc(e.major_free) + '</span>', '<span class="num">' + esc(e.minor_free) + '</span>',
        '<span class="small">' + esc(e.note || '') + '</span><details data-key="enc-' + esc(b) + '"><summary>citations</summary>' + citeBlock(e.cite) + '</details>'];
    }));
    var levT = U.table(['lever', 'what it is', 'slots used (major / minor) by width', 'area blocks', 'fmax parameter', 'why other rows are unaffected'], Object.keys(levers).map(function (id) {
      var l = levers[id], sl = Object.keys(l.slots || {}).map(function (b) { return b + ': ' + l.slots[b].major + ' / ' + l.slots[b].minor; }).join('; ');
      return ['<span class="mono">' + esc(id) + '</span>', esc(l.label || '') + '<details data-key="lev-' + esc(id) + '"><summary>citations</summary>' + citeBlock(l.cite) + '</details>',
        '<span class="num small">' + esc(sl) + '</span>', mono((l.blocks || []).join(', ')),
        l.fmax_param ? '<button type="button" class="linkish mono"' + U.sideAttr({ kind: 'param', id: l.fmax_param }) + '>' + esc(l.fmax_param) + '</button>' : '',
        '<span class="small">' + esc(l.default_rationale || '') + '</span>'];
    }));
    var effRows = effects.map(function (e) {
      var wlLabel = U.wlName(state.data, e.wl);
      return '<tr data-isa-effect="' + esc(effKey(e)) + '"' + (effectActive(state, e) ? ' data-active="1"' : '') + '>' +
        '<td><button type="button" class="linkish mono"' + U.sideAttr(effRef(e)) + '>' + esc(e.lever) + (e.value !== undefined ? ' = ' + esc(e.value) : '') + '</button>' +
        (effectActive(state, e) ? ' <span class="badge">on in live point</span>' : '') + '</td>' +
        '<td>' + esc(wlLabel) + '<div class="small mono">' + esc(e.wl) + '</div></td>' +
        EFFECT_FIELDS.map(function (f) { return '<td class="r">' + bandCell(e[f[0]]) + '</td>'; }).join('') +
        '<td class="small mono">' + esc((e.enables || []).join(', ')) + '</td>' +
        '<td>' + U.methodBadge(e.method) + ' ' + U.statusBadge(e.status) + '</td>' +
        '<td><details data-key="eff-' + esc(effKey(e)) + '"><summary>rationale, cites</summary><p class="small">' + esc(e.rationale) + '</p>' +
        citeBlock(e.cite) + '<p class="small">basis: ' + mono(e.src || '') + (e.program ? ' ; program ' + mono(e.program) : '') + '</p></details></td></tr>';
    }).join('');
    var effT = '<h3>Effect rows (' + effects.length + ')</h3><p class="muted small">Delta per workload when the lever is on: lo / nom / hi. ' +
      EFFECT_FIELDS.map(function (f) { return f[0] + ' = ' + f[1]; }).join('; ') + '.</p>' +
      '<div class="tbl"><table class="isa-table"><thead><tr><th>lever</th><th>workload</th>' + EFFECT_FIELDS.map(function (f) { return '<th class="r" title="' + esc(f[1]) + '">' + f[0] + '</th>'; }).join('') +
      '<th>enables</th><th>method / status</th><th>rationale</th></tr></thead><tbody>' + effRows + '</tbody></table></div>';
    return head + m0 + '<h3>Encoding room</h3><div class="tbl">' + encT + '</div><h3>Levers</h3><div class="tbl">' + levT + '</div>' + effT;
  }

  // ------------------------------------------------------------ Data
  function renderData(state) {
    var d = state.data;
    var blocks = U.table(['block', 'area lo / nom / hi (um2)', 'per', 'basis', 'method / status', 'sources'], Object.keys(d.blocks).map(function (id) {
      var b = d.blocks[id];
      return ['<span class="mono">' + esc(id) + '</span><div class="small">' + esc(b.label || '') + '</div>', fmtBandHtml(b.area, ''), esc(b.per || ''), esc(b.basis || ''),
        U.methodBadge(b.method) + ' ' + U.statusBadge(b.status), '<span class="small mono">' + esc((b.sources || []).join('; ')) + '</span>'];
    }));
    var links = U.table(['link', 'kind', 'pins in / out', 'width (bits)', 'method / status', 'sources'], Object.keys(d.links).map(function (id) {
      var l = d.links[id];
      return ['<span class="mono">' + esc(id) + '</span><div class="small">' + esc(l.label || '') + '</div>', esc(l.kind || ''), esc(l.pins_in + ' / ' + l.pins_out), esc(l.width_bits),
        U.methodBadge(l.method) + ' ' + U.statusBadge(l.status), '<span class="small mono">' + esc((l.sources || []).join('; ')) + '</span>'];
    }));
    var wls = U.table(['workload', 'name', 'tags', 'role', 'rate (Hz)', 'engines', 'pins', 'fields with a source'], d.workloads.map(function (w) {
      return ['<span class="mono">' + esc(w.id) + '</span>', esc(w.name || ''), esc((w.tags || []).join(', ')), esc(w.role || ''),
        '<span class="num">' + esc(isNum(w.rate_hz) ? fmtNum(w.rate_hz) : '') + '</span>', esc(w.engines), esc(w.pins),
        '<details data-key="w-' + esc(w.id) + '"><summary>' + Object.keys(w.src || {}).length + ' fields</summary><ul class="cites">' + Object.keys(w.src || {}).map(function (k) {
          return '<li><span class="mono">' + esc(k) + '</span> = <span class="num">' + esc(JSON.stringify(w[k])) + '</span> <span class="small muted">' + esc(w.src[k]) + '</span></li>'; }).join('') + '</ul></details>'];
    }));
    var iss = Object.keys(d.iss).filter(function (k) { return k !== 'src' && k !== 'pins' && k !== 'sources'; }).map(function (k) { return [k, d.iss[k]]; });
    var issT = U.table(['ISS constant', 'value'], iss.concat([['pins', JSON.stringify(d.iss.pins)]]).map(function (r) {
      return ['<span class="mono">' + esc(r[0]) + '</span>', '<span class="num">' + esc(r[1]) + '</span>']; })) +
      '<p class="small muted">source ' + esc(d.iss.src || '') + '</p><ul class="cites small">' + (d.iss.sources || []).map(function (x) { return '<li class="mono">' + esc(x) + '</li>'; }).join('') + '</ul>';
    var srcs = Object.keys(d.sources || {}), st = d.stamp || {};
    var srcT = '<details data-key="srcs"><summary>Input files (' + srcs.length + ') with sha256</summary><div class="tbl">' + U.table(['file', 'sha256'], srcs.map(function (p) {
      return ['<span class="mono small">' + esc(p) + '</span>', '<span class="mono small">' + esc(d.sources[p]) + '</span>']; })) + '</div></details>' +
      '<p class="small muted">build ' + esc(st.git_describe_at_build || '') + ' ; sources sha256 ' + esc(st.sources_sha256 || '') + '</p>';
    function sec(t, h) { return '<details data-key="data-' + esc(t) + '"><summary><b>' + esc(t) + '</b></summary><div class="tbl">' + h + '</div></details>'; }
    return '<h2>Data</h2>' + sec('Blocks (area)', blocks) + sec('Host links', links) + sec('Workloads', wls) + sec('ISS constants', issT) + '<h3>Provenance</h3>' + srcT;
  }

  // ------------------------------------------------------------ view
  U.renderTrust = function (state) {
    function sec(key, open, inner) { return '<details class="trust-sec" data-trust-sec="' + key + '" data-key="trust-' + key + '"' + (open ? ' open' : '') + '><summary>' + SECT[key] + '</summary>' + inner + '</details>'; }
    var SECT = { calibration: 'Calibration', assumptions: 'Assumptions', isa: 'ISA estimates', data: 'Data' };
    return '<div class="v-trust"><p class="muted">How far to believe the model: measured against model, the numbers we are guessing, and the sources.</p>' +
      sec('calibration', true, renderCalibration(state)) + sec('assumptions', true, renderAssumptions(state)) +
      sec('isa', false, renderIsa(state)) + sec('data', false, renderData(state)) + '</div>';
  };

  // ------------------------------------------------------------ side panel kinds
  U.registerSide('calibration', function (state, ref) {
    var r = A.calibration(state.data).filter(function (x) { return x.id === ref.id; })[0];
    if (!r) return { title: ref.id, html: '<p class="muted">No calibration row <code>' + esc(ref.id) + '</code>.</p>' };
    return { title: r.id + ': ' + r.quantity, html: '<div class="v-trust"><p>' + classBadge(state, r.class) + ' <span class="muted">' + esc(classMeaning(state, r.class)) + '</span></p>' +
      '<p class="num">model ' + modelCell(r) + ' ; measured ' + esc(r.measured_text !== undefined && r.measured_text !== null ? r.measured_text : r.measured) + ' ' + esc(r.unit || '') +
      ' ; error ' + esc(isNum(r.error_pct) ? fmtNum(r.error_pct, 2) + ' %' : 'n/a') + '</p>' +
      (r.env ? '<p class="small">environment: ' + esc(r.env) + '</p>' : '') +
      '<p class="mono small">' + esc(r.source || '') + '</p>' + (r.note ? '<p class="muted">' + esc(r.note) + '</p>' : '') + itemsHtml(state, r, true) + '</div>' };
  });
  U.registerSide('isa_effect', function (state, ref) {
    var e = ((state.data.isa && state.data.isa.effects) || []).filter(function (x) {
      return x.wl === ref.wl && x.lever === ref.lever && (ref.value === undefined || x.value === ref.value);
    })[0];
    if (!e) return { title: ref.lever + ' @ ' + ref.wl, html: '<p class="muted">No ISA effect row for this lever and workload.</p>' };
    var lev = (state.data.isa.levers || {})[e.lever] || {};
    var h = '<div class="v-trust"><p class="isa-warning"><b>An estimate.</b> ' + esc(state.data.isa.src || '') + '</p>' +
      '<p>' + U.methodBadge(e.method) + ' ' + U.statusBadge(e.status) + (effectActive(state, e) ? ' <span class="badge">on in the live point</span>' : ' <span class="badge">off in the live point</span>') + '</p>' +
      '<p><b>' + esc(lev.label || e.lever) + '</b> on <b>' + esc(U.wlName(state.data, e.wl)) + '</b>' + (e.value !== undefined ? ' (width ' + esc(e.value) + ' bit)' : '') + '</p>' +
      '<table><thead><tr><th>effect</th><th class="r">lo / nom / hi</th></tr></thead><tbody>' + EFFECT_FIELDS.map(function (f) {
        return '<tr><td><code>' + f[0] + '</code> <span class="muted small">' + esc(f[1]) + '</span></td><td class="r">' + bandCell(e[f[0]]) + '</td></tr>'; }).join('') + '</tbody></table>' +
      ((e.enables || []).length ? '<p class="small">enables limits: ' + mono(e.enables.join(', ')) + '</p>' : '') +
      '<h4>Rationale</h4><p>' + esc(e.rationale) + '</p><h4>Citations</h4>' + citeBlock(e.cite) +
      '<p class="small">basis: ' + mono(e.src || '') + (e.program ? ' ; program ' + mono(e.program) : '') + '</p>' +
      (lev.fmax_param ? '<p class="small">cycle-time cost of the lever: <button type="button" class="linkish mono"' + U.sideAttr({ kind: 'param', id: lev.fmax_param }) + '>' + esc(lev.fmax_param) + '</button></p>' : '') +
      '</div>';
    return { title: e.lever + ' @ ' + e.wl, html: h };
  });

  // ------------------------------------------------------------ DOM hooks (browser only)
  function hasDom(el) { return !!el && typeof el.querySelectorAll === 'function'; }
  function on(el, selector, ev, fn) {
    var els = el.querySelectorAll(selector);
    for (var i = 0; i < els.length; i++) els[i].addEventListener(ev, fn);
  }
  function mountTrust(el, state) {
    on(el, '[data-pfilter]', 'change', function (e) { U.setView('trust', { pstatus: e.target.value }); });
    // A row is committed as a triple when focus leaves it or on Enter (not on every field change), so any edit order works;
    // lo <= nom <= hi is checked on the committed triple only.
    function commit(tr) {
      var id = tr.getAttribute('data-param'), v = {}, ok = true;
      ['lo', 'nom', 'hi'].forEach(function (f) {
        var x = parseFloat(tr.querySelector('input[data-field="' + f + '"]').value);
        if (!isNum(x)) ok = false;
        v[f] = x;
      });
      var err = tr.querySelector('.err');
      if (!ok || !(v.lo <= v.nom && v.nom <= v.hi)) { err.textContent = 'needs lo <= nom <= hi'; tr.classList.add('invalid'); return; }
      err.textContent = ''; tr.classList.remove('invalid');
      var ov = Object.assign({}, state.points[0].arch.param_overrides || {}), b = state.data.params[id];
      if (v.lo === b.lo && v.nom === b.nom && v.hi === b.hi) delete ov[id]; else ov[id] = v;
      if (JSON.stringify(ov) === JSON.stringify(state.points[0].arch.param_overrides || {})) return;   // nothing to commit
      U.setState({ arch: { param_overrides: ov } });
    }
    on(el, 'input.param-input', 'focusout', function (e) {
      var tr = e.target.closest('tr');
      if (tr && !(e.relatedTarget && tr.contains(e.relatedTarget))) commit(tr);
    });
    on(el, 'input.param-input', 'keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commit(e.target.closest('tr')); }
    });
    on(el, '[data-reset]', 'click', function (e) {
      var ov = Object.assign({}, state.points[0].arch.param_overrides || {});
      delete ov[e.currentTarget.getAttribute('data-reset')];
      U.setState({ arch: { param_overrides: ov } });
    });
    on(el, '[data-reset-all]', 'click', function () { U.setState({ arch: { param_overrides: {} } }); });
  }

  U.register('trust', { title: 'Trust', render: function (s) { return U.renderTrust(s); }, mount: function (el, s) { if (hasDom(el)) mountTrust(el, s); } });
})(ArchSimUI);

/* Last file of the UI bundle: starts the page once every view file has registered. No-op without a DOM (QuickJS tests). */
if (typeof document !== 'undefined' && typeof window !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { ArchSimUI.init(); });
  else ArchSimUI.init();
}

</script>
</body>
</html>
