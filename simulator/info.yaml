# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "TBD"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Two-engine PIO chip: an SPI host port into the register map, 18 protocol pins."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_protocol_emulator.v"
    - "pio_chip.sv"
    - "pio_clkdiv.sv"
    - "pio_engine.sv"
    - "pio_fifo.sv"
    - "host_spi.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# Every name below is the protocol pin it carries: docs/mvp-regmap.md `### Physical layer`
# for the host port and docs/mvp-interfaces.md `### Protocol pins` for the 18 pins
# (uio[0..7] = pins 0..7, ui_in[7:3] = pins 8..12, uo_out[7:3] = pins 13..17).
# The datasheet table that goes with these names, and the check that the two agree, are in
# docs/info.md `## Pinout` and docs/derive_datasheet_facts.py (`--verify`).
pinout:
  # Inputs
  ui[0]: "CSn"
  ui[1]: "SCK"
  ui[2]: "MOSI"
  ui[3]: "PIO_IN8"
  ui[4]: "PIO_IN9"
  ui[5]: "PIO_IN10"
  ui[6]: "PIO_IN11"
  ui[7]: "PIO_IN12"

  # Outputs
  uo[0]: "MISO"
  uo[1]: "TX_READY"
  uo[2]: "RX_VALID"
  uo[3]: "PIO_OUT13"
  uo[4]: "PIO_OUT14"
  uo[5]: "PIO_OUT15"
  uo[6]: "PIO_OUT16"
  uo[7]: "PIO_OUT17"

  # Bidirectional pins
  uio[0]: "PIO0"
  uio[1]: "PIO1"
  uio[2]: "PIO2"
  uio[3]: "PIO3"
  uio[4]: "PIO4"
  uio[5]: "PIO5"
  uio[6]: "PIO6"
  uio[7]: "PIO7"

# Do not change!
yaml_version: 6
